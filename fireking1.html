    <h1><i>Fire king</i></h1>
    <section>
      <h2>sobre o deck</h2>
      <figure>
        <img src="img/fire_king_boss.jpg" width="300" height="250" alt="carta elfnote">
        <figcaption>
        <p>O design dos Fire King é uma mistura de principalmente mitologia, animais sagrados, fogo, destruição e renascimento. As referências exatas nem sempre são confirmadas oficialmente, então algumas associações abaixo são interpretações bastante naturais a partir dos nomes e das artes.</p>
<br>
        <p>Garunix é uma gigantesca ave divina envolvida em chamas, aproximando-o do conceito da fênix, criatura mitológica que morre e renasce das próprias cinzas. Isso não está apenas na arte. A mecânica do Fire King High Avatar Garunix original também representa esse ciclo: ele é destruído, retorna posteriormente e provoca uma nova destruição. Assim, o próprio gameplay reproduz a ideia de morte → renascimento → fogo → nova destruição.</p>
<br>
        <p>Fire King Avatar Barong possui um nome que remete fortemente ao Barong da cultura balinesa, uma figura espiritual normalmente representada como uma criatura semelhante a um leão. Isso combina com a aparência do monstro. Fire King Avatar Kirin faz referência ao qilin/kirin, criatura da mitologia do Leste Asiático. Em diferentes representações, ela pode apresentar características de cervo, dragão e outros animais fantásticos. Já Legendary Fire King Ponix parece deliberadamente menor e mais jovem que Garunix. O próprio nome provavelmente brinca com Phoenix + Ponix, e seu design lembra uma pequena ave de fogo. Tematicamente, é quase uma representação do início do ciclo que eventualmente culmina nas enormes aves Fire King.</p>
<br>
        <p>o deck possui como estilo de jogo a destruição de cartas, tanto as do usuário como as do oponente</p>
        </figcaption> 
      </figure>
