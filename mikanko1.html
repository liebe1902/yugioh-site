    <h1><i>Mikanko</i></h1>
    <section>
      <h2>sobre o deck</h2>
      <figure>
        <img src="img/mikankoimagem.jpg" width="300" height="250" alt="carta elfnote">
        <figcaption>
        <p>Mikanko é um arquetipo mistura xintoísmo e mitologia japonesa, miko (donzelas de santuário), kagura, os Três Tesouros Sagrados do Japão e espíritos animais.</p>
<br>
        <p>Ha-Re → espada | Ni-Ni → espelho | Hu-Li → joia</p>
<br>
        <p>Esses três objetos correspondem de maneira muito clara aos Três Tesouros Sagrados do Japão: espada, espelho e joia.</p>
<br>
        <p>Ohime the Manifested Mikanko é onde o conceito religioso fica mais evidente.Seu design é muito mais elaborado. Há roupas cerimoniais extensas, dourado, ornamentos, uma aparência divina e uma postura muito mais solene. Seu nome também costuma ser relacionado a figuras femininas da mitologia japonesa, especialmente Ōgetsuhime, embora novamente seja melhor tratar a identificação específica como interpretação, não confirmação oficial.</p>
<br>
        <p>seu estilo de jogo se baseia em refletir o dano que vc levaria para o adversário.</p>
        </figcaption> 
      </figure>
    </section>
