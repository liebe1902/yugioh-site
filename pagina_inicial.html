    <h1><i>Yugioh</i></h1>
    <section>
       <h2>surgimento do jogo</h2>
       <figure>
           <img src="img/Dark.Magician.Girl.webp" width="300" height="250" alt="carta elfnote">
           <figcaption>
            <p>
            Yu-Gi-Oh! surgiu originalmente como um mangá criado por Kazuki Takahashi, publicado no Japão a partir de 1996. No começo, a obra não era exclusivamente sobre um jogo de cartas: apresentava diversos tipos de jogos e desafios envolvendo Yugi Mutou e o misterioso espírito ligado ao Enigma do Milênio. Com o tempo, um dos jogos apresentados no mangá, inicialmente chamado Magic & Wizards, ganhou grande popularidade entre os leitores. A ideia de monstros sendo invocados por meio de cartas acabou se tornando uma das principais características da franquia. A partir desse sucesso, surgiu o card game físico. A Konami lançou sua versão de Yu-Gi-Oh! no Japão em 1999, e posteriormente o jogo foi expandido internacionalmente. A popularidade cresceu ainda mais com o anime Yu-Gi-Oh! Duel Monsters, que apresentou personagens como Yugi, Kaiba e Joey e tornou cartas como Dark Magician, Blue-Eyes White Dragon e Red-Eyes Black Dragon extremamente conhecidas.
            </p> 
           </figcaption> 
       </figure>
    </section>
<br>
<hr>
<br>
    <section>
        <h2>Evolução do jogo</h2>
        <figure>
           <img src="img/yugioh_arquetipos.jpg" width="450" height="250" alt="carta elfnote">
           <figcaption>
            <p>
            No início, Yu-Gi-Oh! possuía uma estrutura relativamente simples, baseada principalmente em Monstros, Magias e Armadilhas. Conforme novos produtos foram lançados, o jogo passou a receber diferentes mecânicas de invocação. Entre as principais estão Fusion, Ritual, Synchro, Xyz, Pendulum e Link Summon. Cada uma surgiu em diferentes períodos da história do jogo e trouxe novas possibilidades para a construção de decks e estratégias. Outro elemento importante são os arquétipos, grupos de cartas desenvolvidos para funcionar em conjunto e normalmente ligados por nome, temática ou mecânica. Exemplos famosos incluem HERO, Cyber Dragon, Lightsworn, Fire King, Sky Striker, Branded e muitos outros. Alguns arquétipos permanecem relevantes por bastante tempo graças ao lançamento de novos suportes.
            </p> 
           </figcaption> 
        </figure>
    </section>

    <section>
        <h2>Yu-Gi-Oh! competitivo</h2>
        <figure>
           <img src="img/yugi_gif.gif" width="300" height="250" alt="carta elfnote">
           <figcaption>
            <p>
            Com sua expansão internacional, Yu-Gi-Oh! também desenvolveu uma grande comunidade competitiva. Atualmente existem torneios em diferentes níveis, desde eventos realizados em lojas locais até grandes competições, como os Yu-Gi-Oh! Championship Series (YCS) e campeonatos mundiais. O cenário competitivo muda constantemente. Novas coleções introduzem cartas e estratégias, enquanto listas de cartas proibidas e limitadas ajudam a modificar quais decks e combinações podem ser utilizados. Por isso, o chamado metagame pode mudar significativamente ao longo do tempo. Ao mesmo tempo, Yu-Gi-Oh! não se resume ao competitivo. Muitos jogadores colecionam cartas, montam decks baseados em personagens ou arquétipos favoritos e jogam casualmente com amigos. Depois de décadas de existência, Yu-Gi-Oh! evoluiu de um jogo fictício dentro de um mangá para um card game internacional, mantendo como essência a construção de decks, a interação entre diferentes cartas e a criação constante de novas estratégias.
            </p> 
           </figcaption> 
        </figure>
    </section>
